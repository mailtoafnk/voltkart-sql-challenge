<title>Voltkart Query Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0d1214;
    --surface: #151b1e;
    --surface-2: #1c2427;
    --surface-3: #232c30;
    --border: #2a3438;
    --border-soft: #202a2d;
    --text: #e7ecee;
    --text-dim: #8fa0a6;
    --text-faint: #5b6b70;
    --accent: #e2a03f;
    --accent-soft: #e2a03f22;
    --accent-2: #4fb8b0;
    --accent-2-soft: #4fb8b022;
    --danger: #e2685f;
    --success: #6fbf8b;
    --code-bg: #10161890;
    --shadow: 0 12px 32px -12px rgba(0,0,0,0.55);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f5;
      --surface: #ffffff;
      --surface-2: #edf1f1;
      --surface-3: #e4e9e9;
      --border: #d7dcde;
      --border-soft: #e3e7e8;
      --text: #172225;
      --text-dim: #57696e;
      --text-faint: #8b989c;
      --accent: #b97a1e;
      --accent-soft: #b97a1e18;
      --accent-2: #2e8f86;
      --accent-2-soft: #2e8f8618;
      --danger: #c14a41;
      --success: #337a54;
      --code-bg: #eef1f1c0;
      --shadow: 0 12px 28px -14px rgba(20,30,32,0.18);
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f5f5;
    --surface: #ffffff;
    --surface-2: #edf1f1;
    --surface-3: #e4e9e9;
    --border: #d7dcde;
    --border-soft: #e3e7e8;
    --text: #172225;
    --text-dim: #57696e;
    --text-faint: #8b989c;
    --accent: #b97a1e;
    --accent-soft: #b97a1e18;
    --accent-2: #2e8f86;
    --accent-2-soft: #2e8f8618;
    --danger: #c14a41;
    --success: #337a54;
    --code-bg: #eef1f1c0;
    --shadow: 0 12px 28px -14px rgba(20,30,32,0.18);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, .sql-code, .badge, .stat-value, .required-output, .nav-num {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: inherit; }

  /* ---------- layout shell ---------- */
  html, body { height: 100%; }
  .shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "topbar topbar"
      "nav main";
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 22px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark {
    width: 9px; height: 9px; border-radius: 2px;
    background: var(--accent);
    transform: rotate(45deg);
    display: inline-block;
    margin-right: 2px;
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .brand .sub {
    color: var(--text-dim);
    font-size: 13px;
  }
  .topbar .stats {
    display: flex;
    gap: 22px;
    font-size: 12px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .topbar .stats b {
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  /* ---------- nav ---------- */
  nav.sidebar {
    grid-area: nav;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    height: 100%;
    padding: 18px 0 40px;
  }
  .nav-section-label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 16px 20px 8px;
  }
  .nav-section-label:first-child { padding-top: 4px; }
  .nav-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 9px 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text);
    border-left: 2px solid transparent;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active {
    background: var(--accent-soft);
    border-left: 2px solid var(--accent);
  }
  .nav-num {
    font-size: 11px;
    color: var(--text-faint);
    padding-top: 2px;
    min-width: 20px;
  }
  .nav-item.active .nav-num { color: var(--accent); }
  .nav-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .nav-title {
    font-size: 13px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-tech {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.03em;
  }
  .nav-item.active .nav-tech { color: var(--accent-2); }

  /* ---------- main ---------- */
  main {
    grid-area: main;
    padding: 36px 44px 80px;
    height: 100%;
    overflow-y: auto;
  }
  .q-content {
    max-width: 1120px;
    margin: 0 auto;
  }
  .q-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .q-eyebrow .accent { color: var(--accent); font-weight: 600; }
  .badge {
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .badge.tech { background: var(--accent-2-soft); color: var(--accent-2); border-color: transparent; }

  .q-title {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.28;
    margin-bottom: 14px;
    max-width: 62ch;
  }
  .q-ask {
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 64ch;
    margin-bottom: 18px;
  }
  .required-output {
    display: inline-block;
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 7px 12px;
    margin-bottom: 28px;
  }
  .required-output b {
    color: var(--text);
    font-weight: 500;
  }

  .approach {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text);
    max-width: 66ch;
    margin-bottom: 24px;
  }
  .approach + .approach { margin-top: -14px; }

  /* ---------- code panel ---------- */
  .panel-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .copy-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 9px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .copy-btn:focus-visible, .nav-item:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 1px;
  }

  .code-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 26px;
    box-shadow: var(--shadow);
  }
  .code-block pre {
    margin: 0;
    padding: 18px 20px;
    font-size: 12.8px;
    line-height: 1.65;
    white-space: pre;
    font-family: 'IBM Plex Mono', monospace;
  }
  .tok-kw { color: var(--accent-2); }
  .tok-fn { color: var(--accent); }
  .tok-string { color: var(--success); }
  .tok-comment { color: var(--text-faint); font-style: italic; }
  .tok-num { color: #c99bd8; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .tok-num { color: #9558ad; }
  }
  :root[data-theme="light"] .tok-num { color: #9558ad; }

  /* ---------- verified callout ---------- */
  .verified {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-2);
    background: var(--surface-2);
    border-radius: 0 8px 8px 0;
    padding: 16px 20px;
    margin-bottom: 26px;
  }
  .verified-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 8px;
  }
  .verified p {
    margin: 0 0 8px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
  }
  .verified p:last-child { margin-bottom: 0; }
  .verified .stat-value { color: var(--accent); font-weight: 500; }

  /* ---------- perf table (Q10) ---------- */
  .perf-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .perf-table th {
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 500;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .perf-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .perf-table td:first-child { font-family: 'IBM Plex Sans', sans-serif; }
  .perf-table .before { color: var(--text-dim); }
  .perf-table .after { color: var(--accent); font-weight: 500; }
  .perf-table .delta { color: var(--success); }
  .perf-wrap { overflow-x: auto; }

  .shots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 26px;
  }
  @media (max-width: 720px) { .shots { grid-template-columns: 1fr; } }
  .shot { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .shot img { width: 100%; display: block; }
  .shot figcaption {
    font-size: 11px;
    color: var(--text-dim);
    padding: 9px 12px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
  }
  .shot figcaption .op { font-family: 'IBM Plex Mono', monospace; }
  .shot.before figcaption .op { color: var(--danger); }
  .shot.after figcaption .op { color: var(--success); }

  /* ---------- footer nav ---------- */
  .q-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border-soft);
  }
  .step-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-btn:hover:not(:disabled) { color: var(--text); border-color: var(--text-faint); }
  .step-btn:disabled { opacity: 0.35; cursor: default; }
  .step-btn .dir { color: var(--text-faint); }
  .q-counter { font-size: 12px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }

  @media (max-width: 860px) {
    .shell {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
      grid-template-areas:
        "topbar"
        "nav"
        "main";
    }
    nav.sidebar {
      border-right: none;
      border-bottom: 1px solid var(--border);
      display: flex;
      height: auto;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 12px;
      gap: 6px;
    }
    .nav-section-label { display: none; }
    .nav-item {
      flex-direction: column;
      border-left: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .nav-item.active { border-bottom: 2px solid var(--accent); border-left: none; }
    .nav-body { flex-direction: row; gap: 6px; }
    main { padding: 26px 20px 60px; }
  }
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1><span class="mark"></span>Voltkart Query Bench</h1>
      <span class="sub">Advanced SQL for Modern Data Engineering &middot; SQL Server T-SQL</span>
    </div>
    <div class="stats">
      <span>customers <b>2,000</b></span>
      <span>orders <b>30,000</b></span>
      <span>order lines <b>56,825</b></span>
      <span>categories <b>26</b></span>
      <span>employees <b>58</b></span>
    </div>
  </header>

  <nav class="sidebar" id="sidebar"></nav>

  <main id="main"></main>
</div>

<script>
const QUERIES = [
{
  section: "Warm-up", number: 1, technique: "JOIN + TOP",
  title: "Top 20 completed orders by value",
  ask: "Voltkart's commercial team wants a quick look at the biggest sales — the customer and sales rep behind each one.",
  requiredOutput: "order_id, order_date, customer_name, sales_rep_name, order_total",
  approach: [
    "sales_rep_id in fact_orders is a foreign key into dim_employee — the self-referencing org-chart table. There's no separate \"sales rep\" table; a Sales Rep is simply a dim_employee row where role = 'Sales Rep'.",
    "Filters, sorts, and narrows fact_orders down to the top 20 rows inside a CTE first, then joins those 20 rows out to dim_customer and dim_employee — rather than joining every completed order to both dimension tables and only discarding down to 20 afterward."
  ],
  sql: `WITH top_orders AS (
    SELECT TOP 20
        order_id, order_date, customer_id, sales_rep_id, order_total
    FROM dbo.fact_orders
    WHERE lower(order_status) = 'completed'
    ORDER BY order_total DESC
)
SELECT
    t.order_id,
    t.order_date,
    dc.customer_name,
    de.employee_name AS sales_rep_name,
    t.order_total
FROM top_orders t
JOIN dbo.dim_customer dc ON dc.customer_id = t.customer_id
JOIN dbo.dim_employee de ON de.employee_id = t.sales_rep_id
ORDER BY t.order_total DESC;`,
  verified: [
    "Returns exactly 20 rows against the live data; every join resolves cleanly, no orphaned customer or sales-rep ids.",
    "Top order: <span class=\"stat-value\">₹611,789.68</span> (order 6010072, Feb 2023). No ties sit at the rank-20/21 boundary in this dataset."
  ]
},
{
  section: "Warm-up", number: 2, technique: "ANTI-JOIN",
  title: "Customers who have never placed an order",
  ask: "Marketing wants to re-engage people who registered but never bought.",
  requiredOutput: "customer_id, customer_name, signup_date",
  approach: [
    "NOT EXISTS, not NOT IN — NOT IN silently returns zero rows for everyone if the subquery's column ever contains a NULL. NOT EXISTS just checks row existence, so it isn't vulnerable to that trap.",
    "No order_status filter: a Cancelled or Returned order still means the customer placed one. Filtering to Completed would wrongly include people whose only order got cancelled."
  ],
  sql: `SELECT
    dc.customer_id,
    dc.customer_name,
    dc.signup_date
FROM dbo.dim_customer dc
WHERE NOT EXISTS (
    SELECT 1
    FROM dbo.fact_orders fo
    WHERE fo.customer_id = dc.customer_id
);`,
  verified: [
    "Returns <span class=\"stat-value\">0 rows</span> on this dataset — all 2,000 registered customers have placed at least one order (any status). That's the correct answer for this data, not a bug."
  ]
},
{
  section: "Warm-up", number: 3, technique: "WINDOW · RANK",
  title: "Top 3 products by revenue, per category",
  ask: "Merchandising wants the stars of each category.",
  requiredOutput: "category_name, product_name, total_revenue, revenue_rank",
  approach: [
    "Two-step CTE: first aggregate line_amount per product (a window function can't SUM and RANK in the same GROUP BY pass), then RANK() OVER (PARTITION BY category_id ORDER BY total_revenue DESC), filtered to rank ≤ 3.",
    "dim_product.category_id points at a product's LEAF category — so only the 15 leaf categories that directly hold products appear here. The 11 parent/rollup categories (e.g. \"Electronics\", root \"All Products\") correctly have no rows: rolling revenue up the tree is a different, harder problem (see Q6/Q7's recursive techniques)."
  ],
  sql: `WITH product_revenue AS (
    SELECT
        p.category_id,
        p.product_id,
        p.product_name,
        SUM(oi.line_amount) AS total_revenue
    FROM dbo.fact_order_items oi
    JOIN dbo.fact_orders o ON o.order_id = oi.order_id
    JOIN dbo.dim_product p ON p.product_id = oi.product_id
    WHERE o.order_status = 'Completed'
    GROUP BY p.category_id, p.product_id, p.product_name
),
ranked AS (
    SELECT
        pr.*,
        c.category_name,
        RANK() OVER (PARTITION BY pr.category_id ORDER BY pr.total_revenue DESC) AS revenue_rank
    FROM product_revenue pr
    JOIN dbo.dim_category c ON c.category_id = pr.category_id
)
SELECT
    category_name,
    product_name,
    total_revenue,
    revenue_rank
FROM ranked
WHERE revenue_rank <= 3
ORDER BY category_name, revenue_rank;`,
  verified: [
    "45 rows total — exactly 3 per category across <span class=\"stat-value\">15 leaf categories</span> (no ties push any category above 3 rows).",
    "e.g. Gaming Laptops' top seller did <span class=\"stat-value\">₹24.1M</span>; Air Conditioners' top seller did <span class=\"stat-value\">₹7.68M</span> — sane, checkable numbers."
  ]
},
{
  section: "Core", number: 4, technique: "WINDOW · SUM/LAG",
  title: "Monthly revenue trend with momentum",
  ask: "Finance wants the revenue trend with a cumulative running total and month-over-month % change.",
  requiredOutput: "order_month (YYYY-MM), monthly_revenue, running_total, mom_pct_change",
  approach: [
    "SUM(...) OVER (ORDER BY order_month ROWS UNBOUNDED PRECEDING) gives the running total. LAG() pulls the previous row's value into the current row so MoM % can be computed without a self-join.",
    "The first month (2023-01) has mom_pct_change = NULL — there's no prior month to compare against. Expected, not a bug."
  ],
  sql: `WITH monthly AS (
    SELECT
        CONVERT(char(7), order_date, 126) AS order_month,
        SUM(order_total) AS monthly_revenue
    FROM dbo.fact_orders
    WHERE order_status = 'Completed'
    GROUP BY CONVERT(char(7), order_date, 126)
)
SELECT
    order_month,
    monthly_revenue,
    SUM(monthly_revenue) OVER (ORDER BY order_month ROWS UNBOUNDED PRECEDING) AS running_total,
    ROUND(
        (monthly_revenue - LAG(monthly_revenue) OVER (ORDER BY order_month))
        / LAG(monthly_revenue) OVER (ORDER BY order_month) * 100
    , 2) AS mom_pct_change
FROM monthly
ORDER BY order_month;`,
  verified: [
    "27 months, Jan 2023 &ndash; Mar 2025. Running total reaches <span class=\"stat-value\">~₹1.78B</span> by the end — which independently matches Q7's CEO team-revenue figure, a nice cross-check.",
    "Caveat worth flagging to a stakeholder: the data cuts off <span class=\"stat-value\">2025-03-15</span>, so the final month is partial and shows an artificial revenue dip — not a real downturn."
  ]
},
{
  section: "Core", number: 5, technique: "WINDOW · NTILE",
  title: "Customers by spend quartile",
  ask: "The CRM team wants to size up the customer base by value.",
  requiredOutput: "spend_quartile, customer_count, avg_lifetime_spend",
  approach: [
    "Per-customer SUM() of completed spend, then NTILE(4) OVER (ORDER BY spend) to split into 4 equal-SIZED groups by rank — not by spend range. Bottom 25% of spenders = quartile 1, top 25% = quartile 4.",
    "Scoped to fact_orders only, not joined to dim_customer — a customer with zero completed orders simply wouldn't appear here, rather than showing up with $0 in quartile 1."
  ],
  sql: `WITH customer_spend AS (
    SELECT
        customer_id,
        SUM(order_total) AS lifetime_spend
    FROM dbo.fact_orders
    WHERE order_status = 'Completed'
    GROUP BY customer_id
),
quartiled AS (
    SELECT
        customer_id,
        lifetime_spend,
        NTILE(4) OVER (ORDER BY lifetime_spend) AS spend_quartile
    FROM customer_spend
)
SELECT
    spend_quartile,
    COUNT(*) AS customer_count,
    AVG(lifetime_spend) AS avg_lifetime_spend
FROM quartiled
GROUP BY spend_quartile
ORDER BY spend_quartile;`,
  verified: [
    "Exactly <span class=\"stat-value\">500 customers</span> per quartile (2,000 &divide; 4, evenly).",
    "Average spend climbs sharply: <span class=\"stat-value\">~₹227K</span> (Q1) &rarr; ₹429K &rarr; ₹629K &rarr; <span class=\"stat-value\">~₹2.27M</span> (Q4) — a small group of high-value customers pulling the top bucket's average well above the rest."
  ]
},
{
  section: "Core", number: 6, technique: "RECURSIVE CTE",
  title: "Every category under 'Computers'",
  ask: "The catalogue team needs to see everything under a part of the tree, at any depth.",
  requiredOutput: "category_id, category_name, depth_level, category_path",
  approach: [
    "Anchor member starts at 'Computers' itself (depth 0). Recursive member joins dim_category back to the CTE on parent_category_id = the CTE's category_id, finding one more level of children each pass — stops automatically once a pass finds no new children.",
    "CAST(... AS NVARCHAR(MAX)) on category_path isn't decorative — SQL Server requires the recursive member's column types to match the anchor exactly, and without it, string concatenation can infer a shorter type that silently truncates on a deeper tree."
  ],
  sql: `WITH subtree AS (
    SELECT
        category_id,
        category_name,
        parent_category_id,
        0 AS depth_level,
        CAST(category_name AS NVARCHAR(MAX)) AS category_path
    FROM dbo.dim_category

),
numbered AS (

        customer_id,
        month_num,
        ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY month_num) AS rn
    FROM customer_months

streaks AS (
    SELECT
        customer_id,
        month_num - rn AS streak_group,
        COUNT(*) AS streak_length
    FROM numbered
    GROUP BY customer_id, month_num - rn
),
longest AS (
    SELECT
        customer_id,
        MAX(streak_length) AS longest_streak_months
    FROM streaks
    GROUP BY customer_id
)

    c.customer_id,
    c.customer_name,
    l.longest_streak_months

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const KEYWORDS = [
  "NOT MATCHED BY TARGET","LEFT OUTER JOIN","ROWS UNBOUNDED PRECEDING",
  "GROUP BY","ORDER BY","PARTITION BY","UNION ALL","NOT MATCHED",
  "INNER JOIN","LEFT JOIN","IS NOT","IS NULL",
  "SELECT","FROM","WHERE","JOIN","ON","AS","WITH","WHEN","THEN","MATCHED",
  "MERGE","USING","UPDATE","SET","INSERT","INTO","VALUES","DELETE",
  "CREATE","INDEX","INCLUDE","DISTINCT","AND","OR","NOT","NULL","EXISTS","TOP",
  "DESC","ASC","CAST","CASE","END","OVER","BETWEEN","ORDER","GROUP","BY"
].sort((a,b) => b.length - a.length);

const FUNCS = ["COUNT","SUM","AVG","MIN","MAX","RANK","DENSE_RANK","NTILE",
  "LAG","LEAD","ROW_NUMBER","YEAR","MONTH","CONVERT","COALESCE","ROUND"];

const kwPattern = new RegExp('\\b(' + KEYWORDS.map(k => k.replace(/ /g, '\\s+')).join('|') + ')\\b', 'gi');
const fnPattern = new RegExp('\\b(' + FUNCS.join('|') + ')(?=\\s*\\()', 'gi');

function highlightPlain(text) {
  let t = text.replace(fnPattern, m => '<span class="tok-fn">' + m + '</span>');
  t = t.replace(kwPattern, m => '<span class="tok-kw">' + m + '</span>');
  t = t.replace(/\b\d+(?:\.\d+)?\b/g, m => '<span class="tok-num">' + m + '</span>');
  return t;
}

function highlightSQL(raw) {
  const src = escapeHtml(raw);
  const protectRe = /(--[^\n]*)|('(?:[^']|'')*')|(\/\*[\s\S]*?\*\/)/g;
  let out = '', lastIndex = 0, m;
  while ((m = protectRe.exec(src)) !== null) {
    out += highlightPlain(src.slice(lastIndex, m.index));
    if (m[1]) out += '<span class="tok-comment">' + m[1] + '</span>';
    else if (m[2]) out += '<span class="tok-string">' + m[2] + '</span>';
    else out += '<span class="tok-comment">' + m[3] + '</span>';
    lastIndex = protectRe.lastIndex;
  }
  out += highlightPlain(src.slice(lastIndex));
  return out;
}

let current = 0;

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  let lastSection = null;
  QUERIES.forEach((q, i) => {
    if (q.section !== lastSection) {
      html += '<div class="nav-section-label">' + q.section + '</div>';
      lastSection = q.section;
    }
    html += '<button class="nav-item' + (i === current ? ' active' : '') + '" data-idx="' + i + '">' +
      '<span class="nav-num">Q' + q.number + '</span>' +
      '<span class="nav-body"><span class="nav-title">' + q.title + '</span>' +
      '<span class="nav-tech">' + q.technique + '</span></span>' +
      '</button>';
  });
  sidebar.innerHTML = html;
  sidebar.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => { current = Number(btn.dataset.idx); render(); });
  });
}

function copyQuery(sql, btn) {
  const done = () => { const orig = btn.textContent; btn.textContent = 'copied'; setTimeout(() => btn.textContent = orig, 1400); };
  try {
    navigator.clipboard.writeText(sql).then(done).catch(() => fallbackCopy(sql, done));
  } catch (e) { fallbackCopy(sql, done); }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

function render() {
  const q = QUERIES[current];
  const main = document.getElementById('main');

  let html = '<div class="q-content">';
  html += '<div class="q-eyebrow"><span class="accent">Q' + q.number + '</span><span>&middot;</span><span>' + q.section + '</span><span class="badge tech">' + q.technique + '</span></div>';
  html += '<h2 class="q-title">' + q.title + '</h2>';
  html += '<p class="q-ask">' + q.ask + '</p>';
  html += '<div class="required-output">required output &nbsp; <b>' + q.requiredOutput + '</b></div>';

  q.approach.forEach(p => { html += '<p class="approach">' + p + '</p>'; });

  html += '<div class="panel-label"><span>solution.sql</span><button class="copy-btn" id="copyBtn">copy</button></div>';
  html += '<div class="code-block"><pre>' + highlightSQL(q.sql) + '</pre></div>';

  if (q.perf) {
    html += '<div class="panel-label"><span>SET STATISTICS IO &mdash; logical reads</span></div>';
    html += '<div class="perf-wrap"><table class="perf-table"><thead><tr><th>table</th><th>before</th><th>after</th><th>change</th></tr></thead><tbody>';
    q.perf.rows.forEach(r => {
      html += '<tr><td>' + r.table + '</td><td class="before">' + r.before + '</td><td class="after">' + r.after + '</td><td class="delta">' + r.delta + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  if (q.shots) {
    html += '<div class="panel-label"><span>execution plan</span></div>';
    html += '<div class="shots">';
    q.shots.forEach((s, i) => {
      const cls = i === 0 ? 'before' : 'after';
      html += '<figure class="shot ' + cls + '"><img src="' + IMG_DATA[s.file] + '" alt="Execution plan, ' + s.cap + '">' +
        '<figcaption><span>' + s.cap + '</span><span class="op">' + s.op + '</span></figcaption></figure>';
    });
    html += '</div>';
  }

  html += '<div class="verified"><div class="verified-label">verified against the loaded data</div>';
  q.verified.forEach(v => { html += '<p>' + v + '</p>'; });
  html += '</div>';

  html += '<div class="q-footer">';
  html += '<button class="step-btn" id="prevBtn"' + (current === 0 ? ' disabled' : '') + '><span class="dir">&larr;</span> prev</button>';
  html += '<span class="q-counter">Q' + q.number + ' of ' + QUERIES.length + '</span>';
  html += '<button class="step-btn" id="nextBtn"' + (current === QUERIES.length - 1 ? ' disabled' : '') + '>next <span class="dir">&rarr;</span></button>';
  html += '</div>';

  html += '</div>'; // close .q-content
  main.innerHTML = html;

  document.getElementById('copyBtn').addEventListener('click', (e) => copyQuery(q.sql, e.target));
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.addEventListener('click', () => { if (current > 0) { current--; render(); renderSidebar(); window.scrollTo(0,0); } });
  if (nextBtn) nextBtn.addEventListener('click', () => { if (current < QUERIES.length - 1) { current++; render(); renderSidebar(); window.scrollTo(0,0); } });

  renderSidebar();
}

render();
</script>
